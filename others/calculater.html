 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Calculator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .calc-container { background: #1e293b; padding: 20px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 360px; }
        #display { width: 100%; height: 60px; background: #0f172a; border: none; outline: none; text-align: right; padding: 10px 20px; font-size: 24px; color: #38bdf8; border-radius: 10px; margin-bottom: 20px; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 15px; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; background: #334155; color: white; transition: 0.2s; }
        button:hover { background: #475569; }
        .op { background: #0369a1; }
        .op:hover { background: #0284c7; }
        .eq { background: #0ea5e9; grid-column: span 2; }
        .eq:hover { background: #38bdf8; }
        .sci { background: #475569; font-size: 14px; }
        .clear { background: #991b1b; }
        .clear:hover { background: #b91c1c; }
    </style>
</head>
<body>
    <div class="calc-container">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button class="sci" onclick="push('Math.sin(')">sin</button>
            <button class="sci" onclick="push('Math.cos(')">cos</button>
            <button class="sci" onclick="push('Math.tan(')">tan</button>
            <button class="clear" onclick="clr()">C</button>
            
            <button class="sci" onclick="push('Math.sqrt(')">√</button>
            <button class="sci" onclick="push('Math.log10(')">log</button>
            <button class="sci" onclick="push('**')">^</button>
            <button class="op" onclick="del()">DEL</button>
            
            <button onclick="push('7')">7</button>
            <button onclick="push('8')">8</button>
            <button onclick="push('9')">9</button>
            <button class="op" onclick="push('/')">/</button>
            
            <button onclick="push('4')">4</button>
            <button onclick="push('5')">5</button>
            <button onclick="push('6')">6</button>
            <button class="op" onclick="push('*')">×</button>
            
            <button onclick="push('1')">1</button>
            <button onclick="push('2')">2</button>
            <button onclick="push('3')">3</button>
            <button class="op" onclick="push('-')">-</button>
            
            <button onclick="push('0')">0</button>
            <button onclick="push('.')">.</button>
            <button class="op" onclick="push('(')">(</button>
            <button class="op" onclick="push(')')">)</button>
            
            <button onclick="push('Math.PI')">π</button>
            <button onclick="push('Math.E')">e</button>
            <button class="eq" onclick="calc()">=</button>
            <button class="op" onclick="push('+')">+</button>
        </div>
    </div>

    <script>
        const d = document.getElementById('display');
        function push(v) { d.value += v; }
        function clr() { d.value = ''; }
        function del() { d.value = d.value.slice(0, -1); }
        function calc() {
            try {
                let expr = d.value;
                // Auto-close parentheses
                const openCount = (expr.match(/\(/g) || []).length;
                const closeCount = (expr.match(/\)/g) || []).length;
                for(let i=0; i < openCount - closeCount; i++) { expr += ')'; }
                d.value = eval(expr);
            } catch (e) {
                d.value = "Error";
                setTimeout(clr, 1500);
            }
        }
        document.addEventListener('keydown', (e) => {
            if (e.key >= 0 && e.key <= 9 || ['+', '-', '*', '/', '.', '(', ')'].includes(e.key)) push(e.key);
            if (e.key === 'Enter') calc();
            if (e.key === 'Backspace') del();
            if (e.key === 'Escape') clr();
        });
    </script>
</body>
</html>
